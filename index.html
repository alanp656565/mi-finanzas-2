<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Centro Financiero Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d0e12;
      color: #fff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }
    h2 {
      font-size: 15px;
      margin: 20px 0 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .card {
      background: #1a1b23;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 15px;
    }
    input { background: #2a2b36; color: #fff; }
    button { background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .eliminar { background: #dc2626; }
    .eliminar:hover { background: #b91c1c; }
    .ingreso { color: #4ade80; }
    .gasto { color: #f87171; }
    .auth-section { text-align: center; margin-bottom: 20px; }
    .datos-usuario { margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>

  <h1>💰 Mis Finanzas</h1>
  
  <!-- Sección de Inicio de Sesión -->
  <div class="card auth-section" id="seccion-auth">
    <h2>Iniciar Sesión / Registrarse</h2>
    <input type="email" id="correo" placeholder="Tu correo electrónico">
    <input type="password" id="clave" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Entrar</button>
    <button onclick="registrarse()" style="background: #16a34a;">Crear Cuenta</button>
  </div>

  <div class="datos-usuario" id="usuario-info" style="display:none;"></div>
  <button id="cerrar-sesion" onclick="cerrarSesion()" style="display:none; background: #4b5563;">Cerrar Sesión</button>

  <!-- Sección de Datos -->
  <div id="seccion-datos" style="display:none;">
    <div class="card">
      <h2>Saldo Actual</h2>
      <h1 id="saldo" style="font-size: 36px; margin: 10px 0;">$0.00</h1>
    </div>

    <div class="card">
      <h2>Agregar Movimiento</h2>
      <input type="text" id="descripcion" placeholder="Descripción">
      <input type="number" id="monto" placeholder="Monto (positivo = ingreso, negativo = gasto)" step="0.01">
      <button onclick="agregarMovimiento()">Guardar</button>
    </div>

    <div class="card">
      <h2>Gráfica</h2>
      <canvas id="grafica"></canvas>
    </div>

    <div class="card">
      <h2>Historial</h2>
      <div id="lista"></div>
    </div>
  </div>

<script>
// TUS CLAVES YA CONFIGURADAS ✅
const SUPABASE_URL = "https://inlvymeimjjzqebwzdsd.supabase.co";
const SUPABASE_CLAVE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlubHZteWVpbWlqenFlYnd6ZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MTYxOTMsImV4cCI6MjEwODM5MjE5M30.EJ8oEUp0IQx1vz7V4-69k_qWTQSiwd1i98XNgRULzOo";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLAVE);
let usuarioActivo = null;
let movimientos = [];

// Verificar sesión al cargar
async function verificarSesion() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    usuarioActivo = session.user;
    mostrarApp();
    await cargarMovimientos();
  }
}

// Iniciar sesión
async function iniciarSesion() {
  const correo = document.getElementById('correo').value;
  const clave = document.getElementById('clave').value;
  
  const { data, error } = await supabase.auth.signInWithPassword({
    email: correo,
    password: clave
  });
  
  if (error) return alert('Error: ' + error.message);
  usuarioActivo = data.user;
  mostrarApp();
  await cargarMovimientos();
}

// Registrarse
async function registrarse() {
  const correo = document.getElementById('correo').value;
  const clave = document.getElementById('clave').value;
  
  if (clave.length < 6) {
    return alert('La contraseña debe tener al menos 6 caracteres');
  }
  
  const { data, error } = await supabase.auth.signUp({
    email: correo,
    password: clave
  });
  
  if (error) return alert('Error: ' + error.message);
  alert('✅ Cuenta creada con éxito. Ya puedes entrar con tus datos');
}

// Cerrar sesión
async function cerrarSesion() {
  await supabase.auth.signOut();
  usuarioActivo = null;
  document.getElementById('seccion-auth').style.display = 'block';
  document.getElementById('seccion-datos').style.display = 'none';
  document.getElementById('usuario-info').style.display = 'none';
  document.getElementById('cerrar-sesion').style.display = 'none';
  document.getElementById('correo').value = '';
  document.getElementById('clave').value = '';
}

function mostrarApp() {
  document.getElementById('seccion-auth').style.display = 'none';
  document.getElementById('seccion-datos').style.display = 'block';
  document.getElementById('usuario-info').style.display = 'block';
  document.getElementById('cerrar-sesion').style.display = 'block';
  document.getElementById('usuario-info').textContent = 'Conectado: ' + usuarioActivo.email;
}

// Cargar movimientos desde la nube
async function cargarMovimientos() {
  const { data, error } = await supabase
    .from('finanzas')
    .select('*')
    .order('creado_en', { ascending: false });
  
  if (error) {
    console.error(error);
    return;
  }
  
  movimientos = data || [];
  actualizarVista();
}

// Agregar movimiento
async function agregarMovimiento() {
  const desc = document.getElementById('descripcion').value.trim();
  const monto = parseFloat(document.getElementById('monto').value);
  
  if (!desc || isNaN(monto)) return alert('Completa todos los datos');
  
  const { data, error } = await supabase
    .from('finanzas')
    .insert([
      {
        descripcion: desc,
        monto: monto,
        usuario_id: usuarioActivo.id
      }
    ])
    .select();
  
  if (error) return alert('Error al guardar: ' + error.message);
  
  document.getElementById('descripcion').value = '';
  document.getElementById('monto').value = '';
  
  await cargarMovimientos();
}

// Eliminar
async function eliminarMovimiento(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  
  const { error } = await supabase
    .from('finanzas')
    .delete()
    .eq('id', id);
  
  if (error) return alert('Error al eliminar');
  
  await cargarMovimientos();
}

function actualizarVista() {
  // Saldo
  const total = movimientos.reduce((sum, m) => sum + m.monto, 0);
  document.getElementById('saldo').textContent = '$' + total.toFixed(2);
  
  // Lista
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  movimientos.forEach(m => {
    const div = document.createElement('div');
    div.style.padding = '10px 0';
    div.style.borderBottom = '1px solid #333';
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div>${m.descripcion}</div>
          <div class="${m.monto >= 0 ? 'ingreso' : 'gasto'}">
            ${m.monto >= 0 ? '+' : ''}$${m.monto.toFixed(2)}
          </div>
        </div>
        <button class="eliminar" style="width:auto; padding:6px 12px;" onclick="eliminarMovimiento(${m.id})">✕</button>
      </div>
    `;
    lista.appendChild(div);
  });
  
  // Gráfica
  const ingresos = movimientos.filter(m => m.monto > 0).reduce((s,m)=>s+m.monto,0);
  const gastos = Math.abs(movimientos.filter(m => m.monto < 0).reduce((s,m)=>s+m.monto,0));
  
  if (window.miGrafica) window.miGrafica.destroy();
  const ctx = document.getElementById('grafica').getContext('2d');
  window.miGrafica = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Ingresos', 'Gastos'],
      datasets: [{
        data: [ingresos, gastos],
        backgroundColor: ['#4ade80', '#f87171']
      }]
    }
  });
}

// Iniciar
verificarSesion();
</script>
</body>
</html>
